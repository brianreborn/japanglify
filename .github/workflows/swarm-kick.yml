# Owner /kick → ubuntu mailbox. Never occupies swarm-bench.
# Members check pending events outbound (watch.ps1). No inbound HTTPS.
# NEVER YAML contains("/kick") as a substring of our own comments.
name: Swarm kick

concurrency:
  group: kick-${{ github.event.inputs.host || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      host:
        description: all | win11-pixel | grok-cloud | github-actions
        required: false
        default: all
      issue:
        description: Optional issue to comment on
        required: false

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  parse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'brianreborn' &&
        !contains(github.event.comment.body, 'swarm-kick') &&
        (
          startsWith(github.event.comment.body, '/kick') ||
          endsWith(github.event.comment.body, '/kick')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.p.outputs.go }}
      target: ${{ steps.p.outputs.target }}
      watch: ${{ steps.p.outputs.watch }}
      cloud: ${{ steps.p.outputs.cloud }}
      issue: ${{ steps.p.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event.comment.user.login || github.actor }}
          BODY: ${{ github.event.comment.body || '' }}
          ISSUE_COMMENT: ${{ github.event.issue.number || 0 }}
          ISSUE_DISPATCH: ${{ github.event.inputs.issue || '' }}
          HOST_DISPATCH: ${{ github.event.inputs.host || 'all' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          import swarm_cmd, swarm_kick

          cfg = json.loads(open(".github/swarm-conductor.json", encoding="utf-8").read())
          trusted = cfg["trustedActor"]
          actor = os.environ.get("ACTOR") or ""
          event = os.environ["EVENT"]
          body = os.environ.get("BODY") or ""

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")

          if event == "issue_comment":
              cmd = swarm_cmd.authorized_command(body, actor=actor, trusted=trusted)
              if cmd != "/kick":
                  print("no authorized /kick")
                  out("go", "false")
                  raise SystemExit(0)
              target = swarm_kick.parse_target(body)
              issue = str(int(os.environ.get("ISSUE_COMMENT") or "0"))
          else:
              target = (os.environ.get("HOST_DISPATCH") or "all").strip() or "all"
              raw = os.environ.get("ISSUE_DISPATCH") or ""
              issue = str(int(raw)) if raw.strip().isdigit() else ""

          row = swarm_kick.plan(target)
          if not row["ok"]:
              print("bad target", target)
              out("go", "false")
              raise SystemExit(0)

          marker = "<!-- swarm-kick -->"
          repo = os.environ["GH_REPO"]
          run = os.environ.get("GITHUB_RUN_ID") or ""
          url = f"https://github.com/{repo}/actions/runs/{run}" if run else ""
          text = (
              f"{marker}\n## Swarm kick\n**Kick sent** `{target}` — ubuntu mailbox, does not occupy swarm-bench.\n\n"
              f"- watch mailbox (win11-pixel): `{row['watch']}`\n"
              f"- cloud pending list: `{row['cloud']}`\n"
              f"- run {url}\n\n"
              f"After ubuntu dispatch, a UAT run is `in_progress` while the bench job may still be queued. "
              f"`scripts/swarm-kick-watch.ps1` treats that as pending and starts Runner.Listener if it is down. "
              f"This is not an install."
          )
          if issue and issue != "0":
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{repo}/issues/{issue}/comments", "--input", "-"],
                  input=json.dumps({"body": text}),
                  text=True,
                  check=True,
              )
          out("go", "true")
          out("target", target)
          out("watch", "true" if row["watch"] else "false")
          out("cloud", "true" if row["cloud"] else "false")
          out("issue", issue)
          print("kick", row)
          PY

  cloud:
    needs: parse
    if: needs.parse.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: List pending UAT (in_progress counts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "::notice::UAT run status is in_progress after ubuntu dispatch even while the swarm-bench job is still queued."
          gh run list --repo "$GH_REPO" --workflow swarm-conductor-uat.yml --limit 8
          gh run list --repo "$GH_REPO" --workflow swarm-kick.yml --limit 3
          echo "cloud member checked pending events"
