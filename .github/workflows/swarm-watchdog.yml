# Quota trip + UAT-ready ping + queued-too-long stall. Not intake. Does not install.
name: Swarm Conductor watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  quotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comment-rate trip + UAT-ready ping + 20min queue stall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/swarm_watchdog.py
