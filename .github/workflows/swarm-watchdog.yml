# Quota trip + UAT-ready ping + queued-too-long stall. Not intake. Does not install.
name: Swarm Conductor watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  quotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comment-rate trip + UAT-ready ping + 20min queue stall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, datetime, sys

          cfg = json.loads(pathlib.Path(".github/swarm-conductor.json").read_text())
          trusted = cfg["trustedActor"]
          heading = cfg["heading"]
          marker = cfg["statusMarker"]
          ready_m = "<!-- swarm-uat-ready -->"
          uat_m = "<!-- swarm-bench-uat -->"
          stall_m = "<!-- swarm-uat-queued -->"
          max_n = int((cfg.get("quotas") or {}).get("commentsPerIssuePerHour", 10))
          stall_min = 20
          repo = os.environ["GH_REPO"]
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = (now - datetime.timedelta(hours=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
          stamp = now.strftime("%Y-%m-%dT%H:%M:%SZ")

          def api(method, path, body=None):
              cmd = ["gh", "api", "-X", method, path]
              if body is None:
                  return json.loads(subprocess.check_output(cmd, text=True))
              return json.loads(
                  subprocess.check_output(
                      cmd + ["--input", "-"],
                      input=json.dumps(body),
                      text=True,
                  )
              )

          def mapped(n):
              proc = subprocess.run(
                  [sys.executable, "scripts/uat-map.py", str(n)],
                  text=True,
                  capture_output=True,
              )
              raw = (proc.stdout or "").strip()
              if not raw or raw == "{}":
                  return None
              return json.loads(raw)

          def parse_ts(s):
              if not s:
                  return None
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))

          queued_uat = api(
              "GET",
              f"repos/{repo}/actions/workflows/swarm-conductor-uat.yml/runs?status=queued&per_page=10",
          ).get("workflow_runs") or []

          issues = api("GET", f"repos/{repo}/issues?state=open&per_page=50")
          for issue in issues:
              if issue.get("pull_request"):
                  continue
              n = issue["number"]
              comments = api("GET", f"repos/{repo}/issues/{n}/comments?per_page=100")
              noise = 0
              sticky_id = None
              saw_ready = False
              saw_uat = False
              saw_installed = False
              saw_stall = False
              dispatched_at = None
              last_uat_failed = False
              for c in comments:
                  body = c.get("body") or ""
                  if marker in body:
                      sticky_id = c["id"]
                      continue
                  if stall_m in body:
                      saw_stall = True
                  if ready_m in body:
                      saw_ready = True
                  if uat_m in body:
                      saw_uat = True
                      if "UAT installed" in body:
                          saw_installed = True
                      if "UAT failed" in body:
                          last_uat_failed = True
                      if "UAT dispatched" in body:
                          dispatched_at = parse_ts(c.get("created_at"))
                  login = (c.get("user") or {}).get("login") or ""
                  if login in (trusted, "github-actions[bot]"):
                      continue
                  if (c.get("created_at") or "") >= cutoff:
                      noise += 1
              if noise > max_n:
                  text = (
                      f"{marker}\n## {heading}\n**BLOCKED** by watchdog at {stamp}\n\n"
                      f"Quota commentsPerIssuePerHour exceeded ({noise} non-owner comments in 1h).\n"
                      f"No new agent assignment until @{trusted} posts /accept as the whole comment."
                  )
                  if sticky_id:
                      api("PATCH", f"repos/{repo}/issues/comments/{sticky_id}", {"body": text})
                  else:
                      api("POST", f"repos/{repo}/issues/{n}/comments", {"body": text})
                  continue
              # Stall is per-issue: this issue was dispatched, not installed, not failed, still queued.
              if (
                  dispatched_at
                  and not saw_installed
                  and not last_uat_failed
                  and not saw_stall
                  and queued_uat
              ):
                  age = (now - dispatched_at).total_seconds() / 60.0
                  if age >= stall_min:
                      url = queued_uat[0].get("html_url") or ""
                      api(
                          "POST",
                          f"repos/{repo}/issues/{n}/comments",
                          {
                              "body": (
                                  f"{stall_m}\n## Swarm Bench\n**UAT still queued** (~{int(age)} min). "
                                  f"`Runner.Listener` has not taken [this run]({url}).\n\n"
                                  f"Start `scripts/swarm-kick-watch.ps1` on win11-pixel (Grok CLI types it). "
                                  f"This is not a second `/uat`."
                              )
                          },
                      )
                      continue
              if saw_ready or saw_uat:
                  continue
              row = mapped(n)
              if not row:
                  continue
              pull = f" pull request `{row['pull']}`" if row.get("pull") else ""
              api(
                  "POST",
                  f"repos/{repo}/issues/{n}/comments",
                  {
                      "body": (
                          f"{ready_m}\n## Ready for Pixel UAT\n\n"
                          f"`{row['devRepo']}` `{row['branch']}`{pull} is on the fork.\n\n"
                          f"@{trusted}: to install it on the bench Pixel, comment `/uat` as the **whole comment** on github.com "
                          f"(not the Grok App). That is approval. Nothing installs until you do."
                      )
                  },
              )
          print("watchdog ok", "queued_uat", len(queued_uat))
          PY
