# /uat on an official issue → Swarm Bench (self-hosted Windows + Pixel).
# Never assemble on ubuntu-latest.
# Do not list runners (GITHUB_TOKEN is not admin — 403).
# New bugs: scripts/uat-map.py finds electrobrian agent/<issue>-* (JSON is override).
#
# Loop guards: ignore bots and our own markers. Whole-comment /uat only
# (startsWith so a trailing newline still counts; NEVER contains("/uat") —
# watchdog ready-text mentions the command).
name: Swarm Conductor UAT

concurrency:
  group: uat-${{ github.event.issue.number || github.event.inputs.issue }}
  cancel-in-progress: true

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Official issue number
        required: true

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        !contains(github.event.comment.body, 'swarm-bench-uat') &&
        !contains(github.event.comment.body, 'swarm-uat-ready') &&
        !contains(github.event.comment.body, 'swarm-conductor-status') &&
        startsWith(github.event.comment.body, '/uat')
      )
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.pick.outputs.go }}
      issue: ${{ steps.pick.outputs.issue }}
      branch: ${{ steps.pick.outputs.branch }}
      repo: ${{ steps.pick.outputs.repo }}
      appid: ${{ steps.pick.outputs.appid }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event.comment.user.login || github.actor }}
          BODY: ${{ github.event.comment.body || '' }}
          ISSUE_COMMENT: ${{ github.event.issue.number || 0 }}
          ISSUE_DISPATCH: ${{ github.event.inputs.issue || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          cfg = json.loads(open(".github/swarm-conductor.json", encoding="utf-8").read())
          trusted = cfg["trustedActor"]
          actor = os.environ.get("ACTOR") or ""
          event = os.environ["EVENT"]
          body = (os.environ.get("BODY") or "").replace("\r", "").strip()

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")

          if actor != trusted:
              print("ignored actor", actor)
              out("go", "false")
              raise SystemExit(0)
          if event == "issue_comment" and body != "/uat":
              print("not whole-comment /uat", repr(body[:40]))
              out("go", "false")
              raise SystemExit(0)

          issue = os.environ.get("ISSUE_DISPATCH") or os.environ.get("ISSUE_COMMENT") or "0"
          issue = str(int(issue))
          marker = "<!-- swarm-bench-uat -->"
          repo = os.environ["GH_REPO"]

          def comment(text):
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{repo}/issues/{issue}/comments", "--input", "-"],
                  input=json.dumps({"body": text}),
                  text=True,
                  check=True,
              )

          existing = json.loads(
              subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/issues/{issue}/comments?per_page=100"],
                  text=True,
              )
          )
          recent_dispatch = False
          for c in existing:
              b = c.get("body") or ""
              if marker in b and "UAT dispatched" in b:
                  recent_dispatch = True

          proc = subprocess.run(
              [sys.executable, "scripts/uat-map.py", issue],
              text=True,
              capture_output=True,
          )
          raw = (proc.stdout or "").strip()
          row = json.loads(raw) if raw and raw != "{}" else None
          if not row:
              comment(
                  f"{marker}\n## Swarm Bench\n**UAT skipped** — no `agent/{issue}-*` branch or pull request on electrobrian yet.\n\n"
                  f"`/accept` first and wait for the fork work. Do not invent a branch."
              )
              out("go", "false")
              raise SystemExit(0)

          branch = row["branch"]
          dev = row["devRepo"]
          appid = row.get("applicationId") or "com.japanglify.app"
          pull = row.get("pull")
          extra = f" pull request `{pull}`" if pull else ""
          if not recent_dispatch:
              comment(
                  f"{marker}\n## Swarm Bench\n**UAT dispatched** for issue #{issue} → `{dev}` `{branch}`{extra} (via `{row.get('source')}`).\n\n"
                  f"Waiting for a self-hosted runner labeled `swarm-bench`. If this sits, on the Windows box (logged-in user, not a Windows service):\n"
                  f"`pwsh -File scripts/swarm-bench-runner.ps1`\n\n"
                  f"A queued job will pick up when that listener starts — no second `/uat`. Unlock the phone. This does not merge or `/accept`."
              )
          else:
              print("suppress duplicate UAT dispatched comment")
          out("go", "true")
          out("issue", issue)
          out("branch", branch)
          out("repo", dev)
          out("appid", appid)
          print("dispatch", issue, dev, branch)
          PY

  bench:
    needs: dispatch
    if: needs.dispatch.outputs.go == 'true'
    runs-on: [self-hosted, Windows, swarm-bench]
    timeout-minutes: 60
    steps:
      - name: Assemble + adb install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.dispatch.outputs.issue }}
          DEV_REPO: ${{ needs.dispatch.outputs.repo }}
          BRANCH: ${{ needs.dispatch.outputs.branch }}
          APPID: ${{ needs.dispatch.outputs.appid }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $t0 = Get-Date
          adb devices
          $work = Join-Path $env:RUNNER_TEMP "japanglify-uat"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          git clone --depth 1 --branch $env:BRANCH "https://github.com/$env:DEV_REPO.git" $work
          Set-Location $work
          if (Test-Path .\gradlew.bat) {
            .\gradlew.bat --no-daemon :app:assembleDownloadableDebug
          } else {
            throw "no gradlew.bat"
          }
          $apk = Get-ChildItem -Recurse -Filter "app-downloadable-debug.apk" | Select-Object -First 1
          if (-not $apk) { throw "no downloadable debug apk" }
          adb uninstall $env:APPID 2>$null
          adb install -r $apk.FullName
          $serial = (adb devices | Select-String "device$").Line
          $wall = [math]::Round(((Get-Date) - $t0).TotalSeconds, 3)
          $cpu = $null
          try {
            $sum = (Get-Process -Name java,adb -ErrorAction SilentlyContinue | Measure-Object CPU -Sum).Sum
            if ($sum) { $cpu = [math]::Round($sum, 3) }
          } catch {}
          $delta = @{ wallSec = $wall; ghBillableMin = 0 }
          if ($null -ne $cpu) { $delta.cpuSec = $cpu }
          $row = [ordered]@{
            schema = 1
            at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            role = "swarm-bench"
            state = "installed"
            source = "actions"
            host = $env:COMPUTERNAME
            issue = [int]$env:ISSUE
            delta = $delta
          }
          $fence = "<!-- swarm-usage`n$($row | ConvertTo-Json -Compress)`n-->"
          $human = "usage `swarm-bench` `installed` $($env:COMPUTERNAME) wall ${wall}s"
          if ($null -ne $cpu) { $human += " · cpu ${cpu}s" }
          $human += " · gh 0min · grok credits unknown"
          $body = @"
          <!-- swarm-bench-uat -->
          ## Swarm Bench
          **UAT installed** for issue #$env:ISSUE

          - branch ``$env:BRANCH``
          - apk ``$($apk.Name)``
          - adb ``$serial``

          Unlocked Pixel, long-press Japanese text, wait a few seconds. Comment on this issue what happened. Do not open a second pull request.

          $fence
          $human
          "@
          gh api -X POST "repos/$env:GH_REPO/issues/$env:ISSUE/comments" -f body="$body"
