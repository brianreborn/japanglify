# /uat on an official issue → Swarm Bench (self-hosted Windows + Pixel).
# Never assemble on ubuntu-latest.
# YAML must not embed raw newlines in expressions.
# NEVER YAML contains("/uat") — watchdog quotes it.
# Bench is split so a hung Gradle still leaves logs. Failure comments run on
# ubuntu (report job) because a dead self-hosted runner cannot comment.
name: Swarm Conductor UAT

concurrency:
  group: uat-${{ github.event_name }}-${{ github.event.inputs.issue || github.event.issue.number }}
  cancel-in-progress: true

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Official issue number
        required: true

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'brianreborn' &&
        !contains(github.event.comment.body, 'swarm-bench-uat') &&
        !contains(github.event.comment.body, 'swarm-uat-ready') &&
        !contains(github.event.comment.body, 'swarm-conductor-status') &&
        (
          startsWith(github.event.comment.body, '/uat') ||
          endsWith(github.event.comment.body, '/uat')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.pick.outputs.go }}
      issue: ${{ steps.pick.outputs.issue }}
      branch: ${{ steps.pick.outputs.branch }}
      repo: ${{ steps.pick.outputs.repo }}
      appid: ${{ steps.pick.outputs.appid }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event.comment.user.login || github.actor }}
          BODY: ${{ github.event.comment.body || '' }}
          ISSUE_COMMENT: ${{ github.event.issue.number || 0 }}
          ISSUE_DISPATCH: ${{ github.event.inputs.issue || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          import swarm_cmd

          cfg = json.loads(open(".github/swarm-conductor.json", encoding="utf-8").read())
          trusted = cfg["trustedActor"]
          actor = os.environ.get("ACTOR") or ""
          event = os.environ["EVENT"]
          body = os.environ.get("BODY") or ""

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")

          if event == "issue_comment":
              cmd = swarm_cmd.authorized_command(body, actor=actor, trusted=trusted)
              if cmd != "/uat":
                  print("no authorized /uat", actor, repr(body[:80]))
                  out("go", "false")
                  raise SystemExit(0)

          issue = os.environ.get("ISSUE_DISPATCH") or os.environ.get("ISSUE_COMMENT") or "0"
          issue = str(int(issue))
          marker = "<!-- swarm-bench-uat -->"
          repo = os.environ["GH_REPO"]

          def comment(text):
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{repo}/issues/{issue}/comments", "--input", "-"],
                  input=json.dumps({"body": text}),
                  text=True,
                  check=True,
              )

          proc = subprocess.run(
              [sys.executable, "scripts/uat-map.py", issue],
              text=True,
              capture_output=True,
          )
          raw = (proc.stdout or "").strip()
          row = json.loads(raw) if raw and raw != "{}" else None
          if not row:
              comment(
                  f"{marker}\n## Swarm Bench\n**UAT skipped** — no `agent/{issue}-*` branch or pull request on electrobrian yet.\n\n"
                  f"`/accept` first and wait for the fork work. Do not invent a branch."
              )
              out("go", "false")
              raise SystemExit(0)

          branch = row["branch"]
          dev = row["devRepo"]
          appid = row.get("applicationId") or "com.japanglify.app"
          pull = row.get("pull")
          extra = f" pull request `{pull}`" if pull else ""
          comment(
              f"{marker}\n## Swarm Bench\n**UAT dispatched** for issue #{issue} → `{dev}` `{branch}`{extra} (via `{row.get('source')}`).\n\n"
              f"Waiting for `SHALOM-swarm-bench`. Unlock the Pixel. Do not type a second command. This does not merge."
          )
          out("go", "true")
          out("issue", issue)
          out("branch", branch)
          out("repo", dev)
          out("appid", appid)
          print("dispatch", issue, dev, branch)
          PY

  bench:
    needs: dispatch
    if: needs.dispatch.outputs.go == 'true'
    runs-on: [self-hosted, Windows, swarm-bench]
    timeout-minutes: 50
    outputs:
      apk: ${{ steps.install.outputs.apk }}
      serial: ${{ steps.install.outputs.serial }}
    steps:
      - name: Prove host + adb
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "computer=$env:COMPUTERNAME"
          Get-Process Runner.Listener -ErrorAction SilentlyContinue | Format-Table Id,ProcessName -AutoSize
          adb version
          adb devices -l
          $devs = @(adb devices | Select-String "\tdevice$")
          if ($devs.Count -lt 1) { throw "no adb device (unlock / authorize USB)" }
          if ($devs.Count -gt 1) { throw "more than one adb device" }

      - name: Clone agent branch
        timeout-minutes: 5
        shell: pwsh
        env:
          DEV_REPO: ${{ needs.dispatch.outputs.repo }}
          BRANCH: ${{ needs.dispatch.outputs.branch }}
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "japanglify-uat"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          git clone --depth 1 --branch $env:BRANCH "https://github.com/$env:DEV_REPO.git" $work
          Set-Location $work
          if (-not (Test-Path .\gradlew.bat)) { throw "no gradlew.bat" }
          echo "WORK=$work" >> $env:GITHUB_ENV

      - name: Assemble downloadable debug
        timeout-minutes: 35
        shell: pwsh
        working-directory: ${{ env.WORK }}
        run: |
          $ErrorActionPreference = "Stop"
          .\gradlew.bat --no-daemon :app:assembleDownloadableDebug

      - name: adb install
        id: install
        timeout-minutes: 8
        shell: pwsh
        working-directory: ${{ env.WORK }}
        env:
          APPID: ${{ needs.dispatch.outputs.appid }}
        run: |
          $ErrorActionPreference = "Stop"
          $apk = Get-ChildItem -Recurse -Filter "app-downloadable-debug.apk" | Select-Object -First 1
          if (-not $apk) { throw "no downloadable debug apk" }
          adb uninstall $env:APPID 2>$null
          adb install -r $apk.FullName
          $serial = ((adb devices | Select-String "\tdevice$").Line)
          echo "apk=$($apk.Name)" >> $env:GITHUB_OUTPUT
          echo "serial=$serial" >> $env:GITHUB_OUTPUT

      - name: Comment installed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.dispatch.outputs.issue }}
          BRANCH: ${{ needs.dispatch.outputs.branch }}
          APK: ${{ steps.install.outputs.apk }}
          SERIAL: ${{ steps.install.outputs.serial }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $t0 = Get-Date
          $wall = 0
          $row = [ordered]@{
            schema = 1
            at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            role = "swarm-bench"
            state = "installed"
            source = "actions"
            host = $env:COMPUTERNAME
            issue = [int]$env:ISSUE
            delta = @{ wallSec = $wall; ghBillableMin = 0 }
          }
          $json = ($row | ConvertTo-Json -Compress)
          $body = @"
          <!-- swarm-bench-uat -->
          ## Swarm Bench
          **UAT installed** for issue #$env:ISSUE

          - branch ``$env:BRANCH``
          - apk ``$env:APK``
          - adb ``$env:SERIAL``
          - host ``$env:COMPUTERNAME``

          Unlocked Pixel, long-press Japanese text, wait a few seconds. Comment on this issue what happened. Do not open a second pull request.

          <!-- swarm-usage
          $json
          -->
          usage `swarm-bench` `installed` $($env:COMPUTERNAME) wall 0s · gh 0min · grok credits unknown
          "@
          @{ body = $body } | ConvertTo-Json | gh api -X POST "repos/$env:GH_REPO/issues/$env:ISSUE/comments" --input -

  report:
    needs: [dispatch, bench]
    if: always() && needs.dispatch.outputs.go == 'true' && needs.bench.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Comment UAT failed on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.dispatch.outputs.issue }}
          RESULT: ${{ needs.bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ needs.dispatch.outputs.branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          issue = os.environ["ISSUE"]
          result = os.environ.get("RESULT") or "unknown"
          url = os.environ["RUN_URL"]
          branch = os.environ.get("BRANCH") or ""
          repo = os.environ["GH_REPO"]
          marker = "<!-- swarm-bench-uat -->"
          body = (
              f"{marker}\n## Swarm Bench\n**UAT failed** (`{result}`) for issue #{issue} `{branch}`.\n\n"
              f"The Pixel may be unlocked and still have nothing new — this job never reached **UAT installed**.\n"
              f"Logs: {url}\n\n"
              f"Do not `/accept` again. Same `agent/*` branch. A later `/uat` or `workflow_dispatch` is allowed because this never installed."
          )
          subprocess.run(
              ["gh", "api", "-X", "POST", f"repos/{repo}/issues/{issue}/comments", "--input", "-"],
              input=json.dumps({"body": body}),
              text=True,
              check=True,
          )
          PY
