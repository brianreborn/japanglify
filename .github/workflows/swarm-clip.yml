# Auto-transcode fat issue videos. /clip-ok splices into the original slot.
# YAML must not embed raw newlines in expressions.
name: Swarm clip

concurrency:
  group: clip-${{ github.event.issue.number }}
  cancel-in-progress: false

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  clip:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login != 'github-actions[bot]' &&
      (
        github.event_name == 'issues' ||
        github.event.comment.user.login != 'github-actions[bot]'
      ) &&
      (
        (
          github.event_name == 'issues' &&
          (
            contains(github.event.issue.body, 'user-attachments') ||
            contains(github.event.issue.body, 'githubusercontent.com')
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          !contains(github.event.comment.body, 'swarm-clip-compact') &&
          (
            contains(github.event.comment.body, 'user-attachments') ||
            contains(github.event.comment.body, 'githubusercontent.com') ||
            (
              github.event.comment.user.login == 'brianreborn' &&
              (
                startsWith(github.event.comment.body, '/clip-shrink') ||
                endsWith(github.event.comment.body, '/clip-shrink') ||
                startsWith(github.event.comment.body, '/clip-ok') ||
                endsWith(github.event.comment.body, '/clip-ok')
              )
            ) ||
            (
              github.event.comment.user.login == github.event.issue.user.login &&
              (
                startsWith(github.event.comment.body, '/clip-ok') ||
                endsWith(github.event.comment.body, '/clip-ok')
              )
            )
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        if: ${{ github.event_name == 'issues' || (!startsWith(github.event.comment.body, '/clip-ok') && !endsWith(github.event.comment.body, '/clip-ok')) }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login || github.event.sender.login }}
          BODY: ${{ github.event.comment.body || '' }}
          ISSUE: ${{ github.event.issue.number }}
        run: python3 scripts/swarm-clip.py
