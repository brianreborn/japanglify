# Proves instance JSON and role files load. Safe on GitHub-hosted runners.
name: Swarm Conductor config

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load conductor + instance JSON
        run: |
          python3 - <<'PY'
          import json, pathlib

          def load(p):
              data = json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              print(p, "ok")
              return data

          cfg = load(".github/swarm-conductor.json")
          roles = load("docs/swarm-conductor/roles.json")
          inst = load("docs/japanglify/instance.json")
          hosts = load("docs/japanglify/hosts.json")
          assert cfg["trustedActor"] == "brianreborn", cfg
          assert cfg["statusMarker"].startswith("<!--")
          assert "swarm-conductor" in roles["roles"]
          assert "swarm-bench" in roles["roles"]
          assert "ci.remote-assemble" in roles["never"]["swarm-bench"]
          assert "swarm-bench" in inst["capabilityOverlay"]
          assert "adb.install" in inst["capabilityOverlay"]["swarm-bench"]
          ids = [l["id"] for l in hosts["leases"]]
          assert len(ids) == len(set(ids)), ids
          assert "win11-pixel" in ids
          assert "pool-bench-windows" in ids
          assert all("role" in l for l in hosts["leases"])
          print("conductor config valid")
          PY
      - name: swarm-lease + uat-map + usage + cmd + launch + kick + ping self-test
        run: |
          python3 scripts/swarm-lease.py --self-test
          python3 scripts/swarm-lease.py --from local --id win11-pixel
          python3 scripts/uat-map.py --self-test
          python3 scripts/swarm-usage.py --self-test
          python3 scripts/swarm_cmd.py --self-test
          python3 scripts/swarm-launch.py --self-test
          python3 scripts/swarm_kick.py --self-test
          python3 scripts/swarm-kick.py --self-test
          python3 scripts/swarm_ping.py --self-test
      - name: Prove per-step host routing (dry-run, no spawn)
        run: |
          set -euo pipefail
          python3 scripts/swarm-launch.py --step intake --issue 5 --id grok-cloud
          python3 scripts/swarm-launch.py --step watchdog --issue 5 --id github-actions
          python3 scripts/swarm-launch.py --step classify --issue 5 --id win11-pixel --effort xhigh
          python3 scripts/swarm-launch.py --step fix --issue 7 --id win11-pixel --effort xhigh
          python3 scripts/swarm-launch.py --step uat --issue 5 --id win11-pixel
          if python3 scripts/swarm-launch.py --step intake --issue 5 --id win11-pixel; then
            echo "FAIL intake on win11-pixel should NAK" >&2
            exit 1
          fi
          if python3 scripts/swarm-launch.py --step classify --issue 5 --id grok-cloud --effort xhigh; then
            echo "FAIL classify on grok-cloud should NAK" >&2
            exit 1
          fi
          if python3 scripts/swarm-launch.py --step uat --issue 5 --id github-actions; then
            echo "FAIL uat on github-actions should NAK" >&2
            exit 1
          fi
          echo "launch proof ok"
