name: Bug report
description: Report a reproducible Japanglify defect.
title: "[Bug]: "
labels: ["bug", "effort:medium"]
body:
  - type: markdown
    attributes:
      value: |
        This is an **issue** (bug report), not a pull request.
        Do not include clipboard contents, account data, API tokens, or device identifiers.

        **Clip (optional):** after you open this, drag a short screen recording onto the issue
        (~15s, mp4 / mov / webm). Already-small files we leave alone. A fat recording is fine —
        we offer a compact WebM. GitHub only inline-plays mp4/mov.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Tap...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Accessibility chip
        - Share target
        - Selection menu
        - Clipboard fallback
        - Settings
        - Image/PDF output
        - Build/developer tooling
  - type: textarea
    id: validation
    attributes:
      label: Device and validation context
      description: Android version, app build, and whether this was reproduced on-device.
